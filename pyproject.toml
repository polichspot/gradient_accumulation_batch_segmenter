[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "polichspot-gradient_accumulation_batch_segmenter"
version = "0.1.0"
description = "把输入按语义边界切成独立单元，逐单元核对自动驾驶感知工程师·梯度累积与有效批量相关的特征并标出命中位置"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "polichspot" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://polichspot.github.io"
Repository = "https://github.com/polichspot/gradient_accumulation_batch_segmenter"
Issues = "https://github.com/polichspot/gradient_accumulation_batch_segmenter/issues"

[project.scripts]
gradient_accumulation_batch_segmenter = "gradient_accumulation_batch_segmenter:main"

[tool.setuptools]
py-modules = ["gradient_accumulation_batch_segmenter"]
